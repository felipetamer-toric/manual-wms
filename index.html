<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><title>Manual de Processos WMS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: lista vertical de caixas; processo > atividades (trilha numerada) > subatividades (caixas com cor do cargo) */
:root{--bg:#F4F6FA;--card:#FFFFFF;--fg:#14213D;--mute:#5B6B86;--line:#D5DDEA;--blue:#1F4E9C;--blue2:#03689A;--blue-soft:#E8EEFA;--note:#1F3864;--obs:#FFF6D6;--obs-fg:#6B5A00;
--display:'Bricolage Grotesque','Segoe UI',sans-serif;--body:'Public Sans','Segoe UI',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1626;--card:#16213A;--fg:#E8EEFA;--mute:#9AABC6;--line:#2B3A5A;--blue:#6EA0F0;--blue2:#4FB3E0;--blue-soft:#1B2A4A;--note:#274678;--obs:#3A3314;--obs-fg:#F2DC82;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1626;--card:#16213A;--fg:#E8EEFA;--mute:#9AABC6;--line:#2B3A5A;--blue:#6EA0F0;--blue2:#4FB3E0;--blue-soft:#1B2A4A;--note:#274678;--obs:#3A3314;--obs-fg:#F2DC82;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-inline:16px;padding-block:20px 48px;line-height:1.4}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-size:1.7rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:.9rem;margin:4px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.legend small{color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.68rem;width:100%}
.chip{display:inline-flex;align-items:center;color:#fff;border-radius:999px;padding:3px 10px;font-size:.74rem;font-weight:700;border:0;font-family:inherit}
button.chip{cursor:pointer}
.sys{display:inline-flex;align-items:center;gap:5px;border:1.5px solid;border-radius:6px;padding:2px 8px;font-size:.74rem;font-weight:700;background:var(--card)}
.sys::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor}
.meta{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-items:start;margin-top:10px}
.meta b{font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;opacity:.75;padding-top:5px}
.meta div{display:flex;flex-wrap:wrap;gap:4px}
button.head{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:14px 14px 12px}
button.head:focus-visible{outline:3px solid var(--blue2);outline-offset:-3px}
.t{display:flex;gap:10px;align-items:flex-start}
.t .ar{transition:transform .2s;flex:0 0 auto;margin-top:2px}
.open>.head .ar{transform:rotate(90deg)}
.tag{font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;opacity:.8;font-weight:700;display:block}
.ttl{font-family:var(--display);font-weight:700;font-size:1.12rem;line-height:1.2}
.proc{background:var(--blue-soft);border:2px solid var(--blue);border-radius:14px;overflow:hidden}
.proc.open>.head{background:var(--blue);color:#fff}
.proc.open>.head .sys{color:inherit}
.proc:not(.open)>.head{color:var(--blue)}
.proc.open>.head .ttl{font-size:1.25rem}
.body{display:none;padding:14px 12px 12px 12px}
.open>.body{display:block}
.trail{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:34px}
.trail::before{content:"";position:absolute;left:13px;top:10px;bottom:10px;width:3px;background:var(--blue2);border-radius:2px}
.act{position:relative;background:var(--card);border:2px solid var(--blue2);border-radius:12px;overflow:hidden}
.act::before{content:attr(data-n);position:absolute;left:-34px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--blue2);color:#fff;font-weight:800;font-size:.8rem;display:grid;place-items:center;box-shadow:0 0 0 4px var(--blue-soft)}
.act .ttl{font-size:1rem}
.act.open>.head{background:var(--blue2);color:#fff}
.act:not(.open)>.head{color:var(--blue2)}
.act.open>.head .sys{color:inherit}
.steps{display:flex;flex-direction:column;gap:8px}
.act>.body{background:var(--card)}
.step{display:grid;grid-template-columns:26px 1fr;gap:4px 10px;border:1px solid var(--line);border-left-width:6px;border-radius:10px;padding:10px 12px;background:var(--bg)}
.n{width:24px;height:24px;border-radius:50%;background:var(--blue2);color:#fff;font-weight:800;font-size:.72rem;display:grid;place-items:center}
.step p{margin:0;font-size:.92rem}
.who{grid-column:2;display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.obs{grid-column:2;background:var(--obs);color:var(--obs-fg);border-radius:6px;padding:5px 9px;font-size:.78rem}
.note{background:var(--note);color:#fff;font-weight:700;font-size:.88rem;border-radius:10px;padding:11px 14px;border-left:6px solid #5BA3E6}
.dim .step,.dim .act,.dim .proc{}
.step.off{opacity:.25}
.hint{font-size:.78rem;color:var(--mute)}

.flowwrap{display:flex;flex-direction:column;align-items:center;gap:0}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.6rem;font-weight:800;flex:0 0 auto}
.dot.start{background:#DDF3E1;border:2px solid #2E9E4F;color:#1B6B34;width:auto;border-radius:999px;padding:3px 12px;height:auto;font-size:.68rem;letter-spacing:.05em;text-transform:uppercase}
.dot.end{background:#F9D4D4;border:2px solid #D64545}
.arr2{width:2px;height:22px;background:var(--blue);position:relative;flex:0 0 auto}
.arr2::after{content:"";position:absolute;left:-4px;bottom:-1px;border:5px solid transparent;border-top:7px solid var(--blue);border-bottom:0}
.arr2.lab{height:34px}
.arr2 span{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:.7rem;color:var(--mute);white-space:nowrap;background:var(--bg);padding:0 3px}
.fbox{box-sizing:border-box;width:100%;max-width:360px;border:2px solid var(--rc);border-radius:10px;background:color-mix(in srgb,var(--rc) 13%,var(--card));padding:8px 11px 9px;position:relative}
.fbox .h{font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--rc);filter:brightness(.78)}
.fbox .x{font-weight:700;font-size:.9rem;margin:2px 0 6px}
.fbox .sysrow{display:flex;gap:5px;flex-wrap:wrap}
.fbox .num{position:absolute;top:-10px;left:-10px;width:22px;height:22px;border-radius:50%;background:var(--blue2);color:#fff;font-size:.68rem;font-weight:800;display:grid;place-items:center;border:2px solid var(--card)}
.fbox .par{font-size:.68rem;font-weight:700;color:var(--blue2);margin-bottom:3px}
.obs2{background:var(--obs);color:var(--obs-fg);border-radius:6px;padding:4px 8px;font-size:.74rem;margin-bottom:6px}

.evp{max-width:340px;text-align:center;border-radius:999px;padding:5px 14px;font-size:.76rem;font-weight:700;border:2px solid;line-height:1.25}
.evp.start{background:#DDF3E1;border-color:#2E9E4F;color:#1B6B34}
.evp.mid{background:#FFF1D6;border-color:#E0A23A;color:#7A4B00}
.evp.end{background:#F9D4D4;border-color:#D64545;color:#8A1F1F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .evp.start{background:#173D22;color:#9BE3AF}:root:not([data-theme="light"]) .evp.mid{background:#4a3410;color:#F5CE8A}:root:not([data-theme="light"]) .evp.end{background:#4a1c1c;color:#F5A8A8}}
:root[data-theme="dark"] .evp.start{background:#173D22;color:#9BE3AF}:root[data-theme="dark"] .evp.mid{background:#4a3410;color:#F5CE8A}:root[data-theme="dark"] .evp.end{background:#4a1c1c;color:#F5A8A8}
.gwrow{display:flex;align-items:center;gap:10px;justify-content:center;max-width:360px}
.dia{width:46px;height:46px;position:relative;flex:0 0 auto}
.dia::before{content:"";position:absolute;inset:6px;transform:rotate(45deg);background:#FFF1CC;border:2px solid #D9A400;border-radius:4px}
.dia span{position:absolute;inset:0;display:grid;place-items:center;font-size:1rem;font-weight:800;color:#5c4400}
:root[data-theme="dark"] .dia::before{background:#4a3c10}:root[data-theme="dark"] .dia span{color:#F5DE8A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dia::before{background:#4a3c10}:root:not([data-theme="light"]) .dia span{color:#F5DE8A}}
.gwq{font-weight:700;font-size:.86rem;text-align:left}
.gwq small{display:block;font-weight:600;font-size:.64rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.cols{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;position:relative;padding-top:28px}
.col{display:flex;flex-direction:column;align-items:center;position:relative;min-width:0}
.col>.lbl{position:absolute;top:-22px;font-size:.7rem;font-weight:800;background:var(--card);padding:0 6px;z-index:1;color:var(--fg)}
.col>.up{position:absolute;top:-28px;width:2px;height:28px;background:var(--blue)}
.cols .col.cont::after{content:"";flex:1 0 auto;min-height:24px;width:2px;background:var(--blue)}
.col .fbox{max-width:100%}
.hb{position:absolute;height:2px;background:var(--blue)}.hb.t{top:-28px}.hb.b{bottom:0}
.col:first-child>.hb{left:50%;right:-6px}.col:last-child>.hb{left:-6px;right:50%}
.col .frame,.col .opt{max-width:100%}
.col .frame>.head{padding:10px}.col .frame>.body{padding:10px 8px 14px!important}
.nw{display:none}
@media (max-width:640px){.deep .w{display:none!important}.deep .nw{display:flex!important;flex-direction:column;align-items:center;width:100%}}
.w{display:contents}
.cols.join+.arr2{margin-top:0}
.opt{width:100%;max-width:360px;border:2px dashed var(--blue2);border-radius:12px;padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;position:relative;margin-top:14px}
.opt>.lbl{position:absolute;top:-10px;left:12px;background:var(--card);padding:0 8px;font-size:.7rem;font-weight:800;color:var(--blue2)}
.optw{width:100%;display:flex;flex-direction:column;align-items:center}
.skip{font-size:.74rem;color:var(--mute);border:1.5px dashed var(--line);border-radius:999px;padding:3px 12px;margin-top:8px;text-align:center}
.loop{font-size:.74rem;color:var(--mute);text-align:center;margin-top:8px;border:1.5px dashed var(--line);border-radius:999px;padding:3px 12px}
.opt.full{max-width:100%;padding:12px 8px 8px}
.frame{position:relative;border:2px dashed var(--blue2);border-radius:14px;padding:0;background:var(--card)}
.frame>.head{padding:12px 14px 10px}
.frame>.body{padding:12px 16px 20px!important}.proc>.body{padding:14px 12px 16px!important}
.frame.open>.head{background:var(--blue2);color:#fff;border-radius:11px 11px 0 0}
.frame:not(.open)>.head{color:var(--blue2)}
.frame.open>.head .sys{color:inherit}
.frame{border-style:solid}
.flow-lead{font-size:.8rem;color:var(--mute);margin:0 0 4px;text-align:center}
.procb{padding:14px 12px 16px}

.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{all:unset;cursor:pointer;box-sizing:border-box;padding:8px 14px;border-radius:999px;border:2px solid var(--blue);color:var(--blue);font-weight:700;font-size:.85rem}
.tab[aria-selected="true"]{background:var(--blue);color:var(--card)}
.tab:focus-visible{outline:3px solid var(--blue2);outline-offset:2px}
.rep{width:100%;max-width:360px;border:2px dashed var(--blue2);border-radius:12px;padding:14px 10px 10px;display:flex;flex-direction:column;align-items:center;position:relative;margin-top:6px}
.rep>.lbl{position:absolute;top:-10px;left:12px;background:var(--card);padding:0 8px;font-size:.7rem;font-weight:800;color:var(--blue2)}
.col .rep{max-width:100%}
.ou{font-size:.7rem;font-weight:800;color:var(--mute);margin:6px 0}

.doc{border:3px solid var(--note);border-radius:18px;background:var(--card);overflow:hidden}
.doc>.head{padding:16px 16px 14px}
.doc.open>.head{background:var(--note);color:#fff}
.doc:not(.open)>.head{color:var(--blue)}
.doc.open>.head .sys{color:inherit}
.doc>.body{padding:14px 10px 12px;display:none}
.doc.open>.body{display:block}
.doc .dl{display:flex;flex-direction:column;gap:14px}
.doc>.head .ttl{font-size:1.4rem}
.sys.logo{background:#fff;color:#14213D!important;gap:6px;padding:2px 8px}.sys.logo::before{display:none}.sys.logo img{display:block;max-width:none}.proc.open>.head .sys.logo,.act.open>.head .sys.logo,.frame.open>.head .sys.logo,.doc.open>.head .sys.logo{color:#14213D!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sys:not(.logo){filter:brightness(1.7)}}:root[data-theme="dark"] .sys:not(.logo){filter:brightness(1.7)}
.vstrip{padding:8px 12px 10px;background:var(--card);border-top:1px solid var(--line)}
.vbtn{all:unset;cursor:pointer;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--blue2);color:#fff;font-weight:700;font-size:.82rem}
.vbtn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.vbtn[aria-expanded="true"]{background:var(--note)}
.vplay{margin-top:10px;width:100%}
.vplay video{display:block;width:100%;max-height:70vh;border-radius:10px;background:#000}
.vplay .yt{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}
.vplay small{display:block;margin-top:6px;color:var(--mute);font-size:.74rem}
.frame.open>.vstrip{border-top:0}
.fbox.hl{box-shadow:0 0 0 3px var(--rc),0 5px 16px rgba(0,0,0,.22)}
.hit>.head{box-shadow:inset 6px 0 0 var(--fc)}
.miss{opacity:.55}
.chip{cursor:pointer}
</style></head><body>

const seq=a=>a.map((x,i)=>(i?ARR:'')+x).join('');

const DIA=(q,par)=>`<div class="gwrow"><div class="dia"><span>${par?'+':'×'}</span></div><div class="gwq"><small>${par?'Em paralelo':'Decisão'}</small>${q||''}</div></div>`;
function wrapDeep(wide,narrow,depth){if(!depth)return wide;return `<div class="deep" style="width:100%;display:flex;flex-direction:column;align-items:center"><div class="w" style="width:100%;display:flex;flex-direction:column;align-items:center">${wide}</div><div class="nw">${narrow}</div></div>`}
function COND(q,opt,optHTML,skip,loop,depth){
 const optL=opt==='left';
 const optCol=`<div class="col ${loop?'':'cont'}"><span class="up"></span><span class="lbl">${optL?'Não':'Sim'}</span>${BARS(1,!loop)}${optHTML}${loop?`<div class="loop">↩ ${loop}</div>`:''}</div>`;
 const skipCol=`<div class="col cont"><span class="up"></span><span class="lbl">${optL?'Sim':'Não'}</span>${BARS(1,1)}<div class="skip" style="margin-top:0">${skip}</div></div>`;
 const wide=`${DIA(q)}${ARR}<div class="cols">${optL?optCol+skipCol:skipCol+optCol}</div>`;
 const narrow=`${DIA(q)}<div class="optw"><div class="opt"><span class="lbl">${optL?'Se não':'Se sim'}</span>${optHTML}${loop?`<div class="loop">↩ ${loop}</div>`:''}</div><div class="skip">${skip}</div></div>`;
 return wrapDeep(wide,narrow,depth)}
function GW2(q,par,br,nj,depth,A,inner){
 const cols=br.map(b=>`<div class="col ${nj?'':'cont'}"><span class="up"></span>${b.l?`<span class="lbl">${b.l}</span>`:''}${BARS(1,!nj)}${inner(b)}${b.loop?`<div class="loop">↩ ${b.loop}</div>`:''}</div>`).join('');
 const wide=`${DIA(q,par)}${ARR}<div class="cols">${cols}</div>`;
 const narrow=`${DIA(q,par)}`+br.map((b,i)=>(i?`<div class="ou">${par?'e também':'ou'}</div>`:'')+`<div class="optw"><div class="opt"><span class="lbl">${b.l||'Ramo '+(i+1)}</span>${inner(b)}${b.loop?`<div class="loop">↩ ${b.loop}</div>`:''}</div></div>`).join('');
 return wrapDeep(wide,narrow,depth)}
function R(nodes,A,depth){return seq(nodes.map(nd=>{
 if(nd.t==='s'){const items=A.subs.filter(s=>!s.note);return box(items[nd.i],nd.i+1)}
 if(nd.t==='note')return `<div class="note" style="width:100%;max-width:360px">${A.subs.filter(s=>s.note)[nd.i].note}</div>`;
 if(nd.t==='ev')return `<div class="evp ${nd.k}">${nd.x}</div>`;
 if(nd.t==='rep')return `<div class="rep"><span class="lbl">↻ ${nd.l}</span>${R(nd.nodes,A,1)}</div>`;
 if(nd.t==='gw2')return GW2(nd.q,nd.par,nd.br,nd.nj,depth||0,A,b=>R(b.nodes,A,1));
 if(nd.t==='cond')return COND(nd.q,nd.opt,R(nd.nodes,A,1),nd.skip,nd.loop,depth||0);
 return ''}))}
const st=i=>({t:'s',i}),nt=i=>({t:'note',i}),ev=(x,k)=>({t:'ev',x,k:k||'mid'}),rep=(l,nodes)=>({t:'rep',l,nodes});

'0.1':[st(0),st(1),st(2),ev('Pagamento realizado','end')],

'1.1':[st(0),st(1),{t:'gw2',q:'A carga já veio palletizada?',br:[{l:'Não',nodes:[st(2),st(3),st(4)]},{l:'Sim',nodes:[st(5)]}]},st(6),st(7),st(8)],
'1.2':[st(0),st(1),st(2),st(3),st(4),st(5),ev('Todos os produtos da NF conferidos'),st(6)],
'1.3':[st(0),st(1),st(2),st(3),{t:'cond',q:'WMS ainda aponta divergência?',opt:'right',nodes:[st(4),st(5),st(6),st(7)],skip:'Recebimento finalizado com sucesso'}],
'2.0':[nt(0),st(0),st(1),st(2)],
'2.1':[st(0),st(1),st(2),st(3),st(4),st(5)]};
const PROC=[[
 {start:ev('Separação pendente cadastrada via integração','start'),items:[0,{q:'Pedido possui produto sem possibilidade de reserva?',a:1,skip:'Pedido disponível para separação no coletor'},2],end:null},
 {start:ev('Pedido separado e disponível para expedição','start'),items:[0,1],end:null},
 {start:ev('Pedido disponível para carregamento','start'),items:[0,{xor:{q:'Como será a coleta?',br:[{l:'Coleta do cliente ou rota própria',a:1},{l:'Coleta pela transportadora',a:2}]}},{ev:ev('Pedido faturado pelo setor fiscal')},3],end:ev('Coleta agendada → segue para o Processo 4')},

[

const vcode=(pi,ai)=>(cur===1?'rec':'sep')+'-'+(pi+1)+'-'+(ai+1);
const vstrip=c=>VID[c]?`<div class="vstrip"><button class="vbtn" data-v="${c}" aria-expanded="${!!vstate[c]}">▶ Ver vídeo no sistema</button>${vstate[c]?`<div class="vplay">${YT[c]?`<iframe class="yt" title="Vídeo da atividade" src="https://www.youtube-nocookie.com/embed/${YT[c]}?rel=0&playsinline=1&autoplay=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>`:`<video controls playsinline preload="metadata" data-v="${c}" src="${VID[c]}"></video>`}<small>Vídeo da atividade no WMS. Os números das caixas acima indicam a ordem dos passos.</small></div>`:''}</div>`:'';
function frame(pi,ai,dp){const D=DOCS[cur].data;const A=D[pi].acts[ai],k=cur+'p'+pi+'a'+ai;return `<div class="frame ${state[k]?'open':''}${fcls(A)}" style="width:100%" data-k="${k}">${head('Atividade '+(ai+1),A.n,A)}${vstrip(vcode(pi,ai))}<div class="body"><div class="flowwrap">${state[k]?R(FLOW[cur][pi+'.'+ai],A,dp):''}</div></div></div>`}
function procBody(pi){const p=PROC[cur][pi];const parts=[`<div class="evp start">${p.start.x}</div>`];
 p.items.forEach(it=>{
  if(typeof it==='number')parts.push(frame(pi,it));
  else if(it.ev)parts.push(`<div class="evp ${it.ev.k}">${it.ev.x}</div>`);
  else if(it.xor){const X=it.xor;parts.push(GW2(X.q,false,X.br,false,1,null,b=>frame(pi,b.a,1)))}
  else parts.push(COND(it.q,'right',frame(pi,it.a,1),it.skip,null,1))});
 if(p.end)parts.push(`<div class="evp ${p.end.k}">${p.end.x}</div>`);return seq(parts)}
const fcls=o=>focus?(subs(o).some(s=>s.r===focus)?' hit':' miss'):'';
function docObj(i){return {acts:DOCS[i].data.flatMap(P=>P.acts)}}
function openRole(r){DOCS.forEach((d,i)=>d.data.forEach((P,pi)=>P.acts.forEach((a,ai)=>{if(a.subs.some(x=>!x.note&&x.r===r)){state['d'+i]=1;state[i+'p'+pi]=1;state[i+'p'+pi+'a'+ai]=1}})))}
function render(){
 const app=document.getElementById('app');app.style.setProperty('--fc',focus?COL[focus]:'transparent');

 app.innerHTML=[1,0].map(i=>{cur=i;const D=DOCS[i].data;const k='d'+i;
  const inner=state[k]?`<div class="dl">${D.map((P,pi)=>`<div class="proc ${state[cur+'p'+pi]?'open':''}${fcls(P)}" data-k="${cur}p${pi}">${head('Processo '+(pi+1),P.n,P)}<div class="body"><div class="flowwrap">${state[cur+'p'+pi]?procBody(pi):''}</div></div></div>`).join('')}</div>`:'';
  return `<div class="doc ${state[k]?'open':''}${fcls(docObj(i))}" data-k="${k}">${head('Fluxo',DOCS[i].name,docObj(i))}<div class="body">${inner}</div></div>`}).join('');
 app.querySelectorAll('.head').forEach(b=>{const el=b.parentElement;b.setAttribute('aria-expanded',el.classList.contains('open'));b.onclick=e=>{e.stopPropagation();const k=el.dataset.k;state[k]=!state[k];render()}});
 app.querySelectorAll('.vbtn').forEach(b=>{b.onclick=e=>{e.stopPropagation();const c=b.dataset.v;vstate[c]=!vstate[c];render();if(vstate[c]){const v=document.querySelector('video[data-v="'+c+'"]');if(v)v.play().catch(()=>{})}}});

 const D=DOCS.flatMap(d=>d.data);
 const roles=uniq(D.flatMap(P=>subs(P).map(s=>s.r))),syss=uniq(D.flatMap(P=>subs(P).map(s=>s.s)));
 document.getElementById('leg').innerHTML='<small>Cargos</small>'+roles.map(r=>`<button class="chip" data-r="${r}" style="background:${COL[r]};${focus===r?'outline:3px solid var(--fg)':''}">${r}</button>`).join('')+'<small style="margin-top:6px">Sistemas</small>'+syss.map(sc).join('');
 document.querySelectorAll('#leg button[data-r]').forEach(b=>b.onclick=()=>{focus=focus===b.dataset.r?null:b.dataset.r;if(focus)openRole(focus);render();if(focus){const h=document.querySelector('#app .fbox.hl');if(h)h.scrollIntoView({behavior:'smooth',block:'center'})}});
 const hint=document.getElementById('hint');if(focus){let n=0,m=0;DOCS.forEach(d=>d.data.forEach(P=>P.acts.forEach(a=>{const c=a.subs.filter(x=>!x.note&&x.r===focus).length;if(c){n+=c;m++}})));hint.innerHTML='<b>'+focus+'</b>: '+n+' passos em '+m+' atividades, abertos e destacados abaixo. Toque no cargo de novo para limpar.'}else hint.textContent='Toque em um cargo da legenda para abrir e destacar as atividades dele.';
}
